<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console — a ledger strip of totals, tabbed work areas, and a side drawer that holds each payment voucher */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#16201B; --muted:#5D6762; --line:#D8DCD5;
  --accent:#2D3A8A; --accent-ink:#FFFFFF; --accent-soft:#E5E8F6;
  --ok:#1C6A46; --ok-soft:#E0F0E6; --warn:#875700; --warn-soft:#FAEFD6; --bad:#A12F29; --bad-soft:#F7E2DF;
  --paid:#3D5466; --paid-soft:#E3E9ED;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 12px 32px rgba(22,32,27,.12);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191E1B; --sunk:#212724; --ink:#E6E9E5; --muted:#9AA39E; --line:#2D3430;
  --accent:#A3AEF5; --accent-ink:#111513; --accent-soft:#252A49;
  --ok:#6FC99D; --ok-soft:#173025; --warn:#E7B85E; --warn-soft:#382C12; --bad:#F28C82; --bad-soft:#3A1C19;
  --paid:#AABDCC; --paid-soft:#212E37; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191E1B; --sunk:#212724; --ink:#E6E9E5; --muted:#9AA39E; --line:#2D3430;
  --accent:#A3AEF5; --accent-ink:#111513; --accent-soft:#252A49;
  --ok:#6FC99D; --ok-soft:#173025; --warn:#E7B85E; --warn-soft:#382C12; --bad:#F28C82; --bad-soft:#3A1C19;
  --paid:#AABDCC; --paid-soft:#212E37; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--sunk)}
.rolechip{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ledger > div{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ledger > div + div{border-left:1px solid var(--line)}
.ledger .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ledger .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500;overflow-wrap:anywhere}
.ledger .sub{font-size:12px;color:var(--muted)}
.ledger .you .val{color:var(--accent)}
@media (max-width:720px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger > div:nth-child(3){border-left:0}.ledger > div:nth-child(n+3){border-top:1px solid var(--line)}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;line-height:18px}

.panel{display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[readonly]{background:var(--sunk)}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
.hint.good{color:var(--ok)} .hint.alert{color:var(--warn)}
.err{font-size:12px;color:var(--bad)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice p{margin:0}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1120px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
.cell-main{font-weight:500}
.cell-sub{font-size:12px;color:var(--muted)}
.bif{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.group-h{display:flex;align-items:baseline;gap:8px;margin-top:4px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pending{background:var(--warn-soft);color:var(--warn)}
.s-approved{background:var(--ok-soft);color:var(--ok)}
.s-rejected{background:var(--bad-soft);color:var(--bad)}
.s-paid{background:var(--paid-soft);color:var(--paid)}
.s-muted{background:var(--sunk);color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.urgent{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.overdue{color:var(--bad);font-weight:600}

.verdict{display:flex;flex-direction:column;gap:3px;min-width:170px}
.vlabel{font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.vlabel::before{content:"";width:9px;height:9px;border-radius:2px;background:currentColor}
.v-yes{color:var(--ok)} .v-no{color:var(--bad)} .v-wait{color:var(--warn)} .v-paid{color:var(--paid)}
.vreason{font-size:12px;color:var(--muted);line-height:1.35}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty p{margin:0;max-width:52ch}

.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-b{overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto!important}}
.span2{grid-column:span 2}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}

.voucher{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .num{text-align:right}
.vrow.total{border-top:1px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:10px}
.vrow.total .num{font-size:20px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.route{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.step{padding:3px 10px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:500}
.step.done{background:var(--ok-soft);color:var(--ok)}
.step.now{background:var(--warn-soft);color:var(--warn)}
.step.stop{background:var(--bad-soft);color:var(--bad)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;font-size:14px}
.timeline .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.timeline .dot.ok{background:var(--ok)} .timeline .dot.bad{background:var(--bad)} .timeline .dot.acc{background:var(--accent)}
.timeline .note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:4px;white-space:pre-wrap}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
.file a,.file span.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.actbox{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.readbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.readbox table{min-width:0;background:transparent}
.readbox td,.readbox th{padding:4px 6px;border-bottom:1px solid var(--line);background:transparent}

.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checklist li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.mark{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.no{background:var(--bad-soft);color:var(--bad)} .mark.warn{background:var(--warn-soft);color:var(--warn)} .mark.acc{background:var(--accent-soft);color:var(--accent)}
.vbox{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface)}
.vbox.yes{border-color:var(--ok)} .vbox.no{border-color:var(--bad)} .vbox.wait{border-color:var(--warn)}

.rolecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 4px 3px 3px;font-size:13px}
.person img{width:22px;height:22px;border-radius:50%}
.person button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 6px;font-size:15px;line-height:1}
.picker{position:relative}
.hits{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:260px;overflow-y:auto}
.hit{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.hit:hover,.hit:focus{background:var(--sunk)}
.hit img{width:24px;height:24px;border-radius:50%}
.rolegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.rolegrid{grid-template-columns:minmax(0,1fr)}}
.tdsgrid{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tdsgrid table{min-width:880px}
.tdsgrid td{padding:6px 8px;vertical-align:middle}
.tdsgrid input,.tdsgrid select{padding:6px 8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:min(560px,calc(100% - 32px));font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:var(--surface)}
.infobox{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.selbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Kenzen Ventures · Accounts</span>
      <h1>Payment Desk</h1>
    </div>
    <div class="who">
      <span id="who"></span>
      <button class="btn" id="btn-xlsx" type="button">Save Excel log to Drive</button>
      <button class="btn primary" id="btn-new" type="button">New payment request</button>
    </div>
  </header>

  <section class="ledger" aria-label="Totals">
    <div class="you"><span class="lab">Waiting on you</span><span class="val" id="sum-you">—</span><span class="sub" id="sum-you-sub">&nbsp;</span></div>
    <div><span class="lab">In approval</span><span class="val" id="sum-pend">—</span><span class="sub" id="sum-pend-sub">&nbsp;</span></div>
    <div><span class="lab">Ready to pay</span><span class="val" id="sum-appr">—</span><span class="sub" id="sum-appr-sub">&nbsp;</span></div>
    <div><span class="lab" id="sum-paid-lab">Paid this month</span><span class="val" id="sum-paid">—</span><span class="sub" id="sum-paid-sub">&nbsp;</span></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="queue" aria-selected="true">For you <span class="badge" id="badge-queue" hidden></span></button>
    <button class="tab" role="tab" data-tab="all" aria-selected="false">All requests</button>
    <button class="tab" role="tab" data-tab="pay" aria-selected="false">Payments <span class="badge" id="badge-pay" hidden></span></button>
    <button class="tab" role="tab" data-tab="payees" aria-selected="false">Payees</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Approvals &amp; settings</button>
  </nav>

  <section class="panel" id="panel-queue">
    <div id="queue-banner"></div>
    <div id="queue-body"></div>
  </section>

  <section class="panel" id="panel-all" hidden>
    <div class="toolbar">
      <div class="field grow"><label for="flt-q">Search</label><input type="search" id="flt-q" placeholder="Payee, invoice no., nature, request ID, Instagram handle"></div>
      <div class="field"><label for="flt-status">Status</label>
        <select id="flt-status">
          <option value="all">All statuses</option>
          <option value="pending">In approval</option>
          <option value="approved">Approved, unpaid</option>
          <option value="paid">Paid</option>
          <option value="rejected">Sent back</option>
          <option value="withdrawn">Withdrawn</option>
        </select></div>
      <div class="field"><label for="flt-verdict">Can be paid?</label>
        <select id="flt-verdict"><option value="all">Any</option><option value="yes">Yes</option><option value="no">No</option><option value="wait">Not yet</option></select></div>
      <div class="field"><label for="flt-cc">Cost centre</label><select id="flt-cc"><option value="all">All cost centres</option></select></div>
    </div>
    <div id="all-body"></div>
  </section>

  <section class="panel" id="panel-pay" hidden>
    <div id="pay-bar"></div>
    <div id="pay-body"></div>
    <div class="group-h"><h2>Recently paid</h2><span class="muted small">last 60 days</span></div>
    <div id="paid-body"></div>
  </section>

  <section class="panel" id="panel-payees" hidden>
    <div class="toolbar">
      <div class="field grow"><label for="payee-q">Search payees</label><input type="search" id="payee-q" placeholder="Name, GSTIN, PAN, IFSC, Instagram handle"></div>
      <button class="btn" id="btn-add-payee" type="button" style="align-self:flex-end">Add payee</button>
    </div>
    <div id="payees-body"></div>
  </section>

  <section class="panel" id="panel-settings" hidden>
    <div id="settings-body"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title">
  <div class="drawer-h"><h2 id="drawer-title"></h2><button class="btn ghost" type="button" id="drawer-close" aria-label="Close">Close</button></div>
  <div class="drawer-b" id="drawer-body"></div>
  <div class="drawer-f" id="drawer-foot" hidden></div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>


<script>
/* ===== Shared logic: identical copy runs on the server (Shared.gs) and in the page (Index.html). Edit src/shared.js, not the copies. ===== */
var C194 = {section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000};
var DEFAULT_NATURES = [
  {id:"n-whs",  name:"Warehousing & fulfilment charges", section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000},
  {id:"n-frt",  name:"Freight, transport & courier", section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000},
  {id:"n-job",  name:"Contract manufacturing / job work", section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000},
  {id:"n-pkg",  name:"Packaging & printing", section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000},
  {id:"n-adv",  name:"Advertising, photoshoots & ad production", section:"194C", rateInd:1, rateOther:2, single:30000, annual:100000},

function r2(n){ return Math.round((Number(n)||0)*100)/100; }

function money(n){ return inr(n,2); }

    influencer:!!n.influencer, inactive:!!n.inactive }; });

  return {

function tdsPlan(nat, payee, taxable, invDate, opts){
  opts = opts || {};
  if(!nat || !nat.section) return {applies:false, rate:0, section:"", prior:0, text:"No TDS for this nature of payment."};
  var ent = panEntity(payee && payee.pan);
  var base = ent==="individual" ? nat.rateInd : nat.rateOther;
  var noPan = !!payee && !payee.pan;
  var rate = noPan ? Math.max(base,20) : base;
  var fy = fyOf(invDate);
  var prior = 0;
  if(payee) S.requests.forEach(function(r){
    if(r.id===opts.excludeId) return;
    if(opts.before && !(String(r.createdAt) < opts.before)) return;
    if(r.payeeId!==payee.id || r.kind==="balance" || r.status==="withdrawn" || r.status==="rejected") return;
    if(fyOf(r.invoiceDate)!==fy || (r.tdsSectionCode||"")!==nat.section) return;
    prior += Number(r.taxable)||0;
  });
  var t = Number(taxable)||0;
  var overSingle = nat.single>0 && t>nat.single;
  var overAnnual = nat.annual>0 && prior+t>nat.annual;
  var applies = (!nat.single && !nat.annual) || overSingle || overAnnual;
  var crossing = overAnnual && prior>0 && prior<=nat.annual;
  var text;
  if(applies){
    var why=[]; if(overSingle) why.push("invoice above the "+money0(nat.single)+" limit"); if(overAnnual) why.push(fyLabel(fy)+" total with this payee "+money0(prior+t)+" is above "+money0(nat.annual));
    text = nat.section+" @ "+rate+"%"+(noPan?" (20%: no PAN on file)":ent?(" ("+(ent==="individual"?"individual/HUF":"company/firm")+" rate)"):"")+(why.length?" · "+why.join("; "):"")+".";
  } else {
    var parts=[]; if(nat.single) parts.push("invoice limit "+money0(nat.single)); if(nat.annual) parts.push(money0(prior+t)+" of "+money0(nat.annual)+" used in "+fyLabel(fy));
    text = "Below the "+nat.section+" threshold, so no TDS ("+parts.join("; ")+").";
  }
  return {applies:applies, rate:rate, section:nat.section, prior:prior, crossing:crossing, fy:fy, text:text};
}

function checks(r){
  var L=[]; function add(id,ok,label,reason,sev,ovr,detail){ L.push({id:id,ok:!!ok,label:label,reason:reason,sev:sev||"block",ovr:ovr===undefined?true:ovr,detail:detail||""}); }
  var p=r.payee||{}, cur=S.payees.get(r.payeeId);
  add("att",(r.attachments||[]).length,"Invoice or PI attached","No invoice or PI attached","block",false);
  if(cur && (cur.pan||"")!==(p.pan||"")) add("panchg",false,"","Payee PAN changed after submission. Send back to resubmit","block",false);
  if(p.account){
    add("bank",/^[0-9]{6,18}$/.test(p.account) && IFSC_RE.test(p.ifsc||""),"Bank details on file and valid","Bank account or IFSC invalid","block",false);
    if(cur) add("bankchg",(cur.account||"")===p.account && (cur.ifsc||"")===(p.ifsc||""),"Bank details unchanged since submission","Payee bank details changed after submission. Send back to resubmit","block",false);
  } else add("nobank",false,"","No bank details on file. Confirm the account with the vendor before paying","warn");
  var fam=familyId(r);
  var dup=S.requests.filter(function(x){ return x.id!==r.id && familyId(x)!==fam && x.payeeId===r.payeeId && normInv(x.invoiceNo)===normInv(r.invoiceNo) && x.status!=="withdrawn" && x.status!=="rejected"; })[0];
  add("dup",!dup,"Invoice not already raised or paid",dup?("Duplicate of "+dup.id+" ("+statusLabel(dup.status)+")"):"","block",false);
  add("date",!r.invoiceDate || r.invoiceDate<=todayISO(),"Invoice date isn't in the future","Invoice date is in the future");
  if(r.kind==="advance") add("adv",Number(r.payGross)>0 && Number(r.payGross)<Number(r.invoiceTotal),"Advance "+money0(r.payGross)+" is below the "+(r.docType==="pi"?"PI":"invoice")+" total","Advance amount must be below the invoice total","block",false);
  if(r.kind==="balance"){ var par=S.requests.filter(function(x){return x.id===r.parentId;})[0]; add("par",par && par.status==="paid","Advance "+r.parentId+" is paid","Advance "+r.parentId+" isn't marked paid yet","block",false); }
  if(Number(r.gstAmount)>0) add("gstreg",!!p.gstin,"Payee GSTIN on file (GST is charged)","GST charged but payee has no GSTIN");
  var nat = r.natureId && r.natureId!=="other" ? natureById(r.natureId) : null;
  if(r.kind==="balance"){
    var pr=S.requests.filter(function(x){return x.id===r.parentId;})[0];
    if(pr && pr.tdsApplied) add("tdsbal",r.tdsApplied && Number(r.tdsRate)>=Number(pr.tdsRate),"TDS matches the advance","TDS should stay at "+pr.tdsSectionCode+" @ "+pr.tdsRate+"% as on the advance");
  } else if(nat){
    var pl=tdsPlan(nat,{id:r.payeeId,pan:p.pan},r.taxable,r.invoiceDate,{excludeId:r.id,before:r.createdAt});
    if(pl.applies) add("tds",r.tdsApplied && Number(r.tdsRate)+1e-9>=pl.rate,"TDS "+pl.section+" @ "+pl.rate+"% applied","TDS should be "+pl.section+" @ "+pl.rate+"% ("+(r.tdsApplied?(r.tdsRate+"% used"):"none deducted")+")","block",true,pl.text);
    else if(r.tdsApplied) add("tdsx",false,"","TDS deducted although below the "+pl.section+" threshold","warn",true,pl.text);
    else add("tds",true,pl.section?("Below "+pl.section+" threshold, no TDS needed"):"No TDS for this nature","","block");
    if(pl.applies && pl.crossing) add("cross",false,"","This invoice crosses the "+fyLabel(pl.fy)+" limit. TDS on earlier invoices this year ("+money0(pl.prior)+") may also be due","warn");
  } else add("natm",false,"","Nature of payment isn't in the master. TDS was set by hand","warn");
  if(r.isInfluencer){
    add("ighandle",HANDLE_RE.test(r.igHandle||""),"Instagram handle given","Instagram handle missing","block",false);
    add("reel",REEL_RE.test(r.reelLink||""),"Reel link is a valid Instagram reel/post link","Reel link missing or not an Instagram reel link","block",false);
    add("reelok",!!r.reelCheckedBy,"Reel opened and confirmed live by an approver","Reel not yet confirmed live by an approver","block",false);
  }

}
function passes(c,r){ return c.ok || (c.ovr && r.overrides && r.overrides[c.id]); }
function balanceLeft(r){ return r2((Number(r.invoiceTotal)||0) - (Number(r.payGross)||0)); }
function verdict(r){
  if(r.status==="paid"){
    var rs=["UTR "+(r.utr||"—")+" · "+fmtDate(r.paidOn)];
    if(r.kind==="advance") rs.push(r.balanceId ? ("Balance raised on "+r.balanceId) : ("Balance "+money0(balanceLeft(r))+" not raised yet"));
    return {k:"paid", label:r.kind==="advance"?"Advance paid":"Paid", reasons:rs};
  }
  if(r.status==="withdrawn") return {k:"no", label:"No", reasons:["Request withdrawn"]};
  var pending = r.status==="pending_l1"||r.status==="pending_l2";
  var reasons=checks(r).filter(function(c){ return c.sev==="block" && !passes(c,r) && !(c.id==="reelok" && pending); }).map(function(c){ return c.reason; });
  if(r.status==="rejected") reasons.unshift("Sent back to the requester");
  if(reasons.length) return {k:"no", label:"No", reasons:reasons};
  if(r.status==="pending_l1") return {k:"wait", label:"Not yet", reasons:["Awaiting Level 1 approval"+(r.isInfluencer&&!r.reelCheckedBy?" and reel check":"")]};
  if(r.status==="pending_l2") return {k:"wait", label:"Not yet", reasons:["Awaiting Level 2 approval"]};
  var due = r.dueDate && r.dueDate>todayISO() ? ("Due "+fmtDate(r.dueDate)) : "Due now";
  return {k:"yes", label:"Yes", reasons:["All checks passed · "+due]};
}
function canRaiseBalance(r){ return !!S.me.id && r.status==="paid" && r.kind==="advance" && !r.balanceId && (r.requestedBy===S.me.id || S.isAdmin); }
function myAction(r){
  var me=S.me.id; if(!me) return null;
  if(r.status==="pending_l1" && hasRole("approver1") && r.requestedBy!==me) return "approve";
  if(r.status==="pending_l2" && hasRole("approver2") && r.requestedBy!==me && r.l1By!==me) return "approve";
  if(r.status==="approved" && hasRole("finance")) return "pay";
  if(r.status==="rejected" && r.requestedBy===me) return "fix";
  if(r.status==="paid" && r.kind==="advance" && !r.balanceId && r.requestedBy===me) return "balance";
  return null;
}
function canEditTerms(r){ return (hasRole("approver1")||hasRole("approver2")) && ["pending_l1","pending_l2","approved"].indexOf(r.status)>=0; }
function waitingOn(r){
  if(r.status==="pending_l1") return roleIds("approver1").filter(function(id){return id!==r.requestedBy;});
  if(r.status==="pending_l2") return roleIds("approver2").filter(function(id){return id!==r.requestedBy && id!==r.l1By;});
  if(r.status==="approved") return roleIds("finance");
  if(r.status==="rejected") return [r.requestedBy];
  return [];
}
function isOverdue(r){ return r.dueDate && r.dueDate < todayISO() && ["pending_l1","pending_l2","approved"].indexOf(r.status)>=0; }

/* ---------- server calls ---------- */
function call(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    var runner=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej({message:(e && e.message) || String(e)}); });
    runner[fn].apply(runner,args);
  });
}
function applyState(st){
  S.me={id:st.me.id}; S.isAdmin=st.me.isAdmin; S.owner=st.me.owner; S.sheetUrl=st.sheetUrl||"";
  S.settings=mergeSettings(st.settings, st.natures);
  S.payees=new Map(st.payees.map(function(p){ return [p.id,p]; }));
  S.requests=st.requests.slice().sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); });
  S.loaded=true; S.offline=false; render();
}
var refreshing=false;
function refresh(){
  if(refreshing) return Promise.resolve(); refreshing=true;
  return call("api_state").then(applyState).catch(function(e){ if(!S.loaded){ S.offline=true; S.offlineMsg=e.message; render(); } }).then(function(){ refreshing=false; });
}

  if(!S.loaded){ w.innerHTML='<span class="muted small">Loading…</span>'; $("#btn-new").hidden=true; return; }
  var roles=myRoles().map(function(r){ return '<span class="rolechip">'+(r==="approver1"?"L1":r==="approver2"?"L2":"Finance")+'</span>'; }).join("");
  if(S.isAdmin) roles+='<span class="rolechip">Admin</span>';
  w.innerHTML='<span class="who"><span class="small">'+esc(S.me.id)+'</span>'+roles+'</span>';

function renderLedger(){
  var pend=S.requests.filter(function(r){ return r.status==="pending_l1"||r.status==="pending_l2"; });
  var appr=S.requests.filter(function(r){ return r.status==="approved"; });
  var ready=appr.filter(function(r){ return verdict(r).k==="yes"; });
  var mine=S.requests.filter(function(r){ return myAction(r); });
  var mon=todayISO().slice(0,7);
  var paid=S.requests.filter(function(r){ return r.status==="paid" && String(r.paidOn||"").slice(0,7)===mon; });
  function sum(a){ return a.reduce(function(s,r){ return s+(Number(r.netPayable)||0); },0); }
  var ok=S.loaded;
  $("#sum-you").textContent = ok? String(mine.length) : "—";
  $("#sum-you-sub").textContent = ok? (mine.length? (mine.length+" item"+(mine.length===1?"":"s")+" to action") : "Nothing to action") : "Loading…";
  $("#sum-pend").textContent = ok? money0(sum(pend)) : "—";
  $("#sum-pend-sub").textContent = ok? (pend.length+" request"+(pend.length===1?"":"s")) : " ";
  $("#sum-appr").textContent = ok? money0(sum(ready)) : "—";
  $("#sum-appr-sub").textContent = ok? (ready.length+" cleared"+(appr.length>ready.length?(" · "+(appr.length-ready.length)+" on hold"):"")) : " ";
  $("#sum-paid-lab").textContent = "Paid in "+["January","February","March","April","May","June","July","August","September","October","November","December"][new Date().getMonth()];
  $("#sum-paid").textContent = ok? money0(sum(paid)) : "—";
  $("#sum-paid-sub").textContent = ok? (paid.length+" payment"+(paid.length===1?"":"s")) : " ";
}
function renderTabs(){

  ["queue","all","pay","payees","settings"].forEach(function(t){ $("#panel-"+t).hidden = t!==S.tab; });
  var q=S.requests.filter(function(r){ return myAction(r); }).length; var bq=$("#badge-queue"); bq.hidden=!q; bq.textContent=q;
  var p=S.requests.filter(function(r){ return r.status==="approved"; }).length; var bp=$("#badge-pay"); bp.hidden=!p; bp.textContent=p;

function readSettingsInputs(){
  var d=S.sDraft; if(!d) return;
  var v=function(id){ return $("#"+id); };
  if(v("set-tier")) d.tierLimit=Number(v("set-tier").value)||0;
  if(v("set-gstins")) d.companyGstins=v("set-gstins").value.split(/[\n,]/).map(function(s){return s.trim().toUpperCase();}).filter(Boolean);
  if(v("set-cc")) d.costCentres=v("set-cc").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
  if(v("set-names")){ var m={}; v("set-names").value.split("\n").forEach(function(line){ var i=line.indexOf("="); if(i>0){ var k=line.slice(0,i).trim().toLowerCase(), n=line.slice(i+1).trim(); if(k&&n) m[k]=n; } }); d.names=m; }
  d.natures.forEach(function(n,i){
    if(!v("nat-name-"+i)) return;
    n.name=v("nat-name-"+i).value.trim(); n.section=v("nat-sec-"+i).value.trim().toUpperCase();
    n.rateInd=Number(v("nat-ri-"+i).value)||0; n.rateOther=Number(v("nat-ro-"+i).value)||0;
    n.single=Number(v("nat-s-"+i).value)||0; n.annual=Number(v("nat-a-"+i).value)||0;
    n.influencer=v("nat-inf-"+i).checked; n.inactive=!v("nat-act-"+i).checked;
  });
}

function saveTerms(){
  var st=S.drawer, code=$("#t-terms").value, text=($("#t-custom")&&$("#t-custom").value||"").trim(), due=$("#t-due").value, note=($("#t-note").value||"").trim();

  if(!due) return toast("Enter the pay-by date.","bad");
  if(!note) return toast("Add a reason for the change.","bad");
  st.busy=true;
  call("api_terms", st.id, code, text, due, note).then(function(s){ st.busy=false; st.editTerms=false; applyState(s); renderDetail(false); toast("Terms updated."); })
    .catch(function(e){ st.busy=false; toast(e.message,"bad"); });

function doAction(kind){
  var st=S.drawer, id=st && st.id; if(!id) return;
  var note=($("#act-note")&&$("#act-note").value||"").trim();
  if(kind==="reject" && !note){ toast("Add a comment so the requester knows what to fix.","bad"); $("#act-note").focus(); return; }
  var opts={note:note, accept:!!($("#act-accept")&&$("#act-accept").checked), reel:!!($("#act-reel")&&$("#act-reel").checked)};
  if(kind==="paid"){ opts.utr=($("#pay-utr")&&$("#pay-utr").value||"").trim(); opts.paidOn=$("#pay-date")&&$("#pay-date").value||todayISO(); if(opts.utr.length<6){ toast("Enter the UTR or bank reference from the bank statement.","bad"); return; } }
  document.querySelectorAll("[data-act]").forEach(function(b){ b.disabled=true; }); st.busy=true;
  var r=findReq(id);
  call("api_act", id, kind, opts).then(function(s){
    st.busy=false; applyState(s); closeDrawer();
    var nr=findReq(id);
    toast({approve: nr && nr.status==="approved" ? "Approved. It's now with Finance." : "Approved at Level 1. Sent to Level 2.", reject:"Sent back to the requester.", withdraw:"Request withdrawn.", paid: r && r.kind==="advance" ? "Advance marked as paid. The balance now waits for the requester to raise it." : "Marked as paid."}[kind]);
  }).catch(function(e){ st.busy=false; toast(e.message,"bad"); document.querySelectorAll("[data-act]").forEach(function(b){ b.disabled=false; }); });
}

function compute(d){
  var st=S.drawer;
  var taxable=r2(d.taxable);
  var gst = d.gstRate==="custom" ? r2(d.gstAmount) : r2(taxable*Number(d.gstRate||0)/100);
  var total=r2(taxable+gst);
  var rate = d.tdsApplied ? (Number(d.tdsRate)||0) : 0;
  var tds = d.tdsApplied ? Math.round(taxable*rate/100) : 0;
  var net=r2(total-tds), payGross=total, payTds=tds;
  if(d.kind==="advance"){ payGross=r2(d.payGross); payTds = total>0 ? Math.round(payGross*(taxable/total)*rate/100) : 0; }
  if(d.kind==="balance" && st && st.parent){ payGross=r2(total-(Number(st.parent.payGross)||0)); payTds=Math.max(0, tds-(Number(st.parent.payTds)||0)); }
  return {taxable:taxable,gst:gst,total:total,rate:rate,tds:tds,net:net,payGross:payGross,payTds:payTds,payNet:r2(payGross-payTds)};
}

function onFiles(input){
  var st=S.drawer, files=[].slice.call(input.files); input.value="";
  var map={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp"};
  files.forEach(function(f){
    var type=map[(f.name.split(".").pop()||"").toLowerCase()] || f.type;
    if(["application/pdf","image/png","image/jpeg","image/webp"].indexOf(type)<0){ toast(f.name+": attach a PDF, PNG, JPG or WebP.","bad"); return; }
    if(f.size>10*1024*1024){ toast(f.name+" is over 10 MB. Compress it and try again.","bad"); return; }
    var tmp={name:f.name, uploading:true}; st.attachments.push(tmp); renderAttachList();
    var fr=new FileReader();
    fr.onload=function(){ var b64=String(fr.result).split(",")[1];
      call("api_upload", f.name, type, b64).then(function(res){ Object.assign(tmp,res); delete tmp.uploading; if(S.drawer===st) renderAttachList(); })
        .catch(function(e){ st.attachments.splice(st.attachments.indexOf(tmp),1); if(S.drawer===st) renderAttachList(); toast(e.message,"bad"); }); };
    fr.onerror=function(){ st.attachments.splice(st.attachments.indexOf(tmp),1); renderAttachList(); toast("Couldn't read "+f.name+".","bad"); };
    fr.readAsDataURL(f);
  });
}

  $("#drawer-body").innerHTML=
    '<div class="sect"><div class="sect-h">Vendor or influencer</div><div class="field"><label for="p-name">Payee name (as you know them)</label><input type="text" id="p-name" value="'+esc(p.name)+'"></div>'+
      '<div class="grid2"><div class="field"><label for="p-gstin">GSTIN (optional)</label><input type="text" id="p-gstin" value="'+esc(p.gstin)+'" maxlength="15" style="text-transform:uppercase"></div><div class="field"><label for="p-pan">PAN</label><input type="text" id="p-pan" value="'+esc(p.pan)+'" maxlength="10" style="text-transform:uppercase"><span class="hint">Taken from GSTIN if left blank. Without a PAN, TDS is 20%.</span></div></div>'+
      '<div class="grid2"><div class="field"><label for="p-email">Remittance email (optional)</label><input type="email" id="p-email" value="'+esc(p.email)+'"></div><div class="field"><label for="p-ig">Instagram handle (influencers)</label><input type="text" id="p-ig" value="'+(p.igHandle?("@"+esc(handleClean(p.igHandle))):"")+'" placeholder="@handle"></div></div></div>'+
    '<div class="sect"><div class="sect-h">Bank details (optional)</div><p class="hint" style="margin:0">Saved with the payee and shown to Finance on every future request.'+(st.payeeId&&p.account?" Changes are logged and put open requests for this payee on hold until resubmitted.":"")+'</p>'+
      '<div class="field"><label for="p-benef">Beneficiary name (as per bank)</label><input type="text" id="p-benef" value="'+esc(p.beneficiary)+'"></div>'+
      '<div class="grid2"><div class="field"><label for="p-acct">Account number</label><input type="text" id="p-acct" inputmode="numeric" autocomplete="off" value="'+esc(p.account)+'"></div><div class="field"><label for="p-acct2">Re-enter account number</label><input type="text" id="p-acct2" inputmode="numeric" autocomplete="off" value="'+esc(p.account)+'"></div></div>'+
      '<div class="grid2"><div class="field"><label for="p-ifsc">IFSC</label><input type="text" id="p-ifsc" maxlength="11" value="'+esc(p.ifsc)+'" style="text-transform:uppercase"></div><div class="field"><label for="p-bank">Bank &amp; branch</label><input type="text" id="p-bank" value="'+esc(p.bank)+'"></div></div></div>'+
    '<div class="sect"><div class="sect-h">Defaults for new requests</div><div class="grid3">'+
      '<div class="field"><label for="p-nature">Nature of payment</label><select id="p-nature"><option value="">None</option>'+nats.map(function(n){ return '<option value="'+esc(n.id)+'" '+(n.id===p.defaultNatureId?"selected":"")+'>'+esc(n.name)+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label for="p-cc">Cost centre</label><select id="p-cc"><option value="">None</option>'+S.settings.costCentres.map(function(c){ return '<option '+(c===p.defaultCc?"selected":"")+'>'+esc(c)+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label for="p-terms">Terms of payment</label><select id="p-terms"><option value="">None</option>'+TERMS.filter(function(t){return t.v!=="custom";}).map(function(t){ return '<option value="'+t.v+'" '+(t.v===p.defaultTerms?"selected":"")+'>'+esc(t.l)+'</option>'; }).join("")+'</select></div></div></div>'+
    '<p class="err" id="p-err" hidden></p>';
  setFoot('<button class="btn" type="button" id="p-cancel">'+(st.returnTo?"Back to request":"Cancel")+'</button><button class="btn primary" type="button" id="p-save">Save payee</button>');
}
function savePayee(){
  var st=S.drawer, v=function(id){ return ($("#"+id)&&$("#"+id).value||"").trim(); };
  var errEl=$("#p-err"), fail=function(m){ errEl.textContent=m; errEl.hidden=false; errEl.scrollIntoView({block:"nearest"}); };
  errEl.hidden=true;
  var gstin=v("p-gstin").toUpperCase(), pan=v("p-pan").toUpperCase(), ig=handleClean(v("p-ig"));
  var rec={name:v("p-name"), gstin:gstin, pan:pan, email:v("p-email"), igHandle:ig, defaultNatureId:v("p-nature"), defaultCc:v("p-cc"), defaultTerms:v("p-terms"),
    beneficiary:v("p-benef"), account:v("p-acct").replace(/\s+/g,""), ifsc:v("p-ifsc").toUpperCase(), bank:v("p-bank")};
  if(!rec.name) return fail("Enter the payee name.");
  if(gstin && !GSTIN_RE.test(gstin)) return fail("That GSTIN doesn't look right. It should be 15 characters, e.g. 36AABCK1234L1Z5.");
  if(!pan && gstin) rec.pan=pan=gstin.slice(2,12);
  if(pan && !PAN_RE.test(pan)) return fail("PAN should be 5 letters, 4 digits, 1 letter.");
  if(gstin && pan && gstin.slice(2,12)!==pan) return fail("The PAN doesn't match the PAN inside the GSTIN (characters 3 to 12).");
  if(ig && !HANDLE_RE.test(ig)) return fail("Instagram handles use letters, numbers, dots and underscores only.");
  if(rec.beneficiary || rec.account || rec.ifsc || rec.bank || v("p-acct2")){
    if(!rec.beneficiary) return fail("Enter the beneficiary name as the bank has it, or clear the bank fields.");
    if(!/^[0-9]{6,18}$/.test(rec.account)) return fail("Account number should be 6 to 18 digits.");
    if(rec.account!==v("p-acct2").replace(/\s+/g,"")) return fail("The two account numbers don't match.");
    if(!IFSC_RE.test(rec.ifsc)) return fail("IFSC should be 11 characters: 4 letters, a zero, then 6 letters or digits (e.g. HDFC0001234).");
  }
  var dup=Array.from(S.payees.values()).filter(function(p){ return p.id!==st.payeeId && ((rec.gstin && p.gstin===rec.gstin) || (!rec.gstin && rec.pan && !p.gstin && p.pan===rec.pan)); })[0];
  if(dup) return fail((rec.gstin?"This GSTIN":"This PAN")+" is already saved for "+dup.name+".");
  var btn=$("#p-save"); btn.disabled=true; btn.textContent="Saving…";
  call("api_savePayee", rec, st.payeeId).then(function(res){
    applyState(res.state); toast(rec.name+" saved.");
    if(st.returnTo){ var back=st.returnTo; back.draft.payeeId=res.id; applyPayeeDefaults(back.draft, rec, !st.payeeId); openDrawer(back); } else closeDrawer();
  }).catch(function(e){ btn.disabled=false; btn.textContent="Save payee"; fail(e.message); });
}
function applyPayeeDefaults(d, p, force){
  if(p.defaultCc && (force || !d.costCentre)) d.costCentre=p.defaultCc;
  if(p.defaultNatureId && natureById(p.defaultNatureId) && (force || !d.natureId)) d.natureId=p.defaultNatureId;
  if(p.defaultTerms && (force || !d.termsCode || d.termsCode==="net30")) d.termsCode=p.defaultTerms;
  if(p.igHandle && !d.igHandle) d.igHandle="@"+handleClean(p.igHandle);
}
function exportExcel(){
  var btn=$("#btn-xlsx"); btn.disabled=true; var label=btn.textContent; btn.textContent="Saving to Drive…";
  call("api_export").then(function(res){ btn.disabled=false; btn.textContent=label;
    $("#toast").innerHTML='Saved “'+esc(res.name)+'” to Drive. <a href="'+esc(res.url)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Open it</a>';
    $("#toast").className="toast"; $("#toast").hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ $("#toast").hidden=true; },12000);
  }).catch(function(e){ btn.disabled=false; btn.textContent=label; toast(e.message,"bad"); });
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click",function(){ S.tab=b.dataset.tab; if(S.tab==="settings"){ S.sDirty=false; S.sDraft=null; } render(); }); });
  $("#btn-new").addEventListener("click", openNewRequest);
  $("#btn-xlsx").addEventListener("click", exportExcel);
  $("#btn-add-payee").addEventListener("click", function(){ openPayee(null); });
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && S.drawer) closeDrawer();
    if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("tr[data-open],tr[data-payee]")){ e.preventDefault(); e.target.click(); } });
  ["flt-q","flt-status","flt-cc","flt-verdict"].forEach(function(id){ $("#"+id).addEventListener("input", renderAll); });
  $("#payee-q").addEventListener("input", renderPayees);
  document.addEventListener("click", function(e){
    var t=e.target, c=function(sel){ return t.closest(sel); };
    if(c("a[href]")) return;
    var go=c("[data-goto]"); if(go){ S.tab=go.dataset.goto; S.sDraft=null; S.sDirty=false; render(); return; }
    if(c("[data-new]")) return openNewRequest();
    if(c("[data-addpayee]")) return openPayee(null);
    var jm=c("[data-jump]"); if(jm) return openDrawer({mode:"detail", id:jm.dataset.jump});
    var bl=c("[data-balance]"); if(bl) return openBalance(bl.dataset.balance);
    var op=c("[data-open]"); if(op && !$("#drawer").contains(op)) return openDrawer({mode:"detail", id:op.dataset.open});
    var pe=c("[data-payee]"); if(pe) return openPayee(pe.dataset.payee);
    var ep=c("[data-editpayee]"); if(ep){ var back=Object.assign({},S.drawer,{draft:readForm()}); return openPayee(ep.dataset.editpayee, back); }
    var ac=c("[data-act]"); if(ac) return doAction(ac.dataset.act);
    var ed=c("[data-edit]"); if(ed) return openEditRequest(ed.dataset.edit);
    var tm=c("[data-terms]"); if(tm){ var k=tm.dataset.terms; if(k==="edit"){ S.drawer.editTerms=true; renderDetail(false); } else if(k==="cancel"){ S.drawer.editTerms=false; renderDetail(false); } else saveTerms(); return; }
    if(c("[data-close]")) return closeDrawer();
    if(c("[data-tdsauto]")){ S.drawer.tdsAuto=true; applyAuto(); return; }
    if(c("[data-tdsman]")){ S.drawer.tdsAuto=false; applyAuto(); $("#f-tdsrate").focus(); return; }
    var rm=c("[data-rmatt]"); if(rm){ S.drawer.attachments.splice(Number(rm.dataset.rmatt),1); renderAttachList(); return; }
    if(t.id==="f-submit") return submitRequest();
    if(t.id==="p-save") return savePayee();
    if(t.id==="p-cancel"){ var b2=S.drawer.returnTo; return b2 ? openDrawer(b2) : closeDrawer(); }
    if(t.id==="set-save") return saveSettings();
    if(t.id==="set-reset"){ S.sDirty=false; S.sDraft=null; renderSettings(); return; }
    if(t.id==="nat-add"){ readSettingsInputs(); S.sDraft.natures.push({id:"n-"+rid(),name:"",section:"",rateInd:0,rateOther:0,single:0,annual:0,influencer:false,inactive:false}); markDirty(); renderSettings(); markDirty(); var ni=$("#nat-name-"+(S.sDraft.natures.length-1)); if(ni) ni.focus(); return; }
    var ar=c("[data-addrole]"); if(ar){ readSettingsInputs(); var r=ar.dataset.addrole, inp=$("#role-in-"+r), em=(inp.value||"").trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("Enter a full email address.","bad"); return; }
      if(S.sDraft.roles[r].indexOf(em)<0) S.sDraft.roles[r].push(em); markDirty(); renderSettings(); markDirty(); return; }
    var ur=c("[data-unrole]"); if(ur){ readSettingsInputs(); var rr=ur.dataset.unrole; S.sDraft.roles[rr]=S.sDraft.roles[rr].filter(function(x){ return x!==ur.dataset.id; }); markDirty(); renderSettings(); markDirty(); return; }
  });
  document.addEventListener("change", function(e){
    var t=e.target;
    if(t.id==="f-files") return onFiles(t);
    if(t.dataset && t.dataset.nat!=null){ readSettingsInputs(); markDirty(); return; }
    if(t.id==="t-terms"){ $("#t-custom-wrap").hidden = t.value!=="custom"; var tt=TERMS.filter(function(x){return x.v===t.value;})[0], r=findReq(S.drawer.id); if(tt && tt.days!=null && r){ var base=(t.value==="advance"||t.value==="receipt")?todayISO():r.invoiceDate; if(base) $("#t-due").value=addDays(base,tt.days); } return; }
    if(!S.drawer || S.drawer.mode!=="form") return;
    if(t.id==="f-payee"){
      if(t.value==="__new"){ var back=Object.assign({},S.drawer,{draft:readForm()}); back.draft.payeeId=""; return openPayee(null, back); }
      var p=S.payees.get(t.value), d=readForm(); if(p) applyPayeeDefaults(d,p,false); S.drawer.draft=d; renderForm(); return;
    }
    if(t.id==="f-nature"){ if(t.value!=="other") S.drawer.tdsAuto=true; S.drawer.infManual=false; applyAuto(); return; }
    if(t.id==="f-tdson"){ S.drawer.tdsAuto=false; applyAuto(); return; }
    if(t.id==="f-gstrate"){ $("#f-gstamt").readOnly = t.value!=="custom"; applyAuto(); return; }
    if(["f-doctype","f-kind","f-invdate"].indexOf(t.id)>=0){ applyAuto(); return; }
    if(t.id==="f-terms"){ applyDue(); return; }
    if(t.id==="f-inf"){ S.drawer.infManual=true; applyAuto(); return; }
  });
  document.addEventListener("input", function(e){
    var t=e.target;
    if(S.drawer && S.drawer.mode==="form" && t.closest("#drawer")){
      if(t.id==="f-taxable") applyAuto();
      else if(t.id==="f-tdsrate"||t.id==="f-tdssec"){ S.drawer.tdsAuto=false; updateCalc(); }
      else if(t.id==="f-due"){ S.drawer.dueAuto=false; $("#f-due-hint").textContent="Set by hand."; }
      else if(t.id==="f-gstamt"||t.id==="f-paygross") updateCalc();
      else if(t.id==="f-reel"){ var ok=!t.value||REEL_RE.test(t.value.trim()), er=$("#f-reel-err"); er.hidden=ok; er.textContent=ok?"":"Use the link from Instagram's Share → Copy link, e.g. https://www.instagram.com/reel/ABC123xyz/"; }
      else if(t.id==="f-ig"){ var ok2=!t.value||HANDLE_RE.test(t.value.trim()), er2=$("#f-ig-err"); er2.hidden=ok2; er2.textContent=ok2?"":"Handles use letters, numbers, dots and underscores."; }
    }
    if(["set-tier","set-cc","set-gstins","set-names"].indexOf(t.id)>=0 || (t.dataset && t.dataset.nat!=null)){ readSettingsInputs(); markDirty(); }
  });
}
bind(); render(); refresh();
setInterval(function(){ if(document.visibilityState==="visible" && !(S.drawer && S.drawer.mode!=="detail")) refresh(); }, 30000);

</script>
